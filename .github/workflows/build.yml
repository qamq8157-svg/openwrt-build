name: Build OpenWrt x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch v24.10.8 https://github.com/openwrt/openwrt.git openwrt

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure x86_64
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF

          make defconfig

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc)

      - name: Show firmware files
        working-directory: openwrt
        run: |
          echo "===== Firmware files ====="
          find bin/targets/x86/64/ -maxdepth 1 -type f -printf '%f\n'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: openwrt/bin/targets/x86/64/*
